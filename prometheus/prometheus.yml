global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # When running via docker-compose --profile app, use service names
  - job_name: 'military-aircraft-svc'
    static_configs:
      - targets: ['military-aircraft-svc:8081']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'aircraft-db-ingestor'
    static_configs:
      - targets: ['aircraft-db-ingestor:8082']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'military-watcher-api'
    static_configs:
      - targets: ['military-watcher-api:8080']
    metrics_path: /metrics
    scrape_interval: 10s
